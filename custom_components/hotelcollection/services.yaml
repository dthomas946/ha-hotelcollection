set_mode:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: hotelcollection
    mode:
      required: true
      example: 5
      selector:
        number:
          min: 1
          max: 5
          mode: box
    enabled:
      selector:
        boolean:
    days:
      example: '["Sat", "Sun"]'
      selector:
        select:
          multiple: true
          options:
            - Mon
            - Tue
            - Wed
            - Thu
            - Fri
            - Sat
            - Sun
    start:
      example: "20:00"
      selector:
        time:
    end:
      example: "23:59"
      selector:
        time:
    spray_seconds:
      example: 70
      selector:
        number:
          min: 5
          max: 300
          unit_of_measurement: s
          mode: box
    pause_seconds:
      example: 90
      selector:
        number:
          min: 5
          max: 300
          unit_of_measurement: s
          mode: box
